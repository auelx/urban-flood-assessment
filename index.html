<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Flood Assessment</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map"></div>

  <div class="custom-controls">

    <div class="layer-panel" id="layer-panel">
      <h3>Layers</h3>
      <div id="layer-list"></div>
      <div class="layer-separator"></div>
      <h3>BaseMaps</h3>
      <div id="basemap-list"></div>
    </div>

    <button class="control-btn" id="btn-layers" title="Toggle layers panel" aria-pressed="false">
        <i data-lucide="layers" width="20" height="20"></i>
      </button>

    <div class="control-group">
      <button class="control-btn" id="btn-zoom-in" title="Zoom In">
        <i data-lucide="plus" width="20" height="20"></i>
      </button>
      <button class="control-btn" id="btn-zoom-out" title="Zoom Out">
        <i data-lucide="minus" width="20" height="20"></i>
      </button>
    </div>

    <details id="btn-info">
      <summary class="control-btn" title="Attribution Info" aria-label="Attribution Info" style="outline-style: none;">
        <i data-lucide="info" width="20" height="20"></i>
      </summary>
      <span class="attribution-modal">
        Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
      </span>
    </details>
      

  </div>

  <div class="info-panel" id="info-panel">
    <div class="info-panel__header">
      <span class="info-panel__logo" id="info-logo"></span>
      <h4 class="info-panel__title" id="info-title"></h4>
      <button class="info-panel__close" id="info-close" title="Close" aria-label="Close">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div class="info-panel__content" id="info-content"></div>
  </div>

  <div class="image-modal" id="image-modal">
    <button class="image-modal__close" id="image-modal-close" title="Close" aria-label="Close">
      <i data-lucide="x" width="24" height="24"></i>
    </button>
    <button class="image-modal__nav image-modal__nav--prev" id="image-modal-prev" title="Previous" aria-label="Previous">
      <i data-lucide="chevron-left" width="28" height="28"></i>
    </button>
    <img id="image-modal-img" alt="">
    <button class="image-modal__nav image-modal__nav--next" id="image-modal-next" title="Next" aria-label="Next">
      <i data-lucide="chevron-right" width="28" height="28"></i>
    </button>
  </div>

  <div class="data-error" id="data-error"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="script.js"></script>
</body>
</html>
