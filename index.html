<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Flood Assessment</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map"></div>

  <div class="custom-controls">

    <div class="layer-panel" id="layer-panel">
      <h3>Layers</h3>
      <div id="layer-list"></div>
      <div class="layer-separator"></div>
      <h3>BaseMaps</h3>
      <div id="basemap-list"></div>
    </div>

    <button class="control-btn" id="btn-layers" title="Toggle layers panel" aria-pressed="false">
        <i data-lucide="layers" width="20" height="20"></i>
      </button>

    <div class="control-group">
      <button class="control-btn" id="btn-zoom-in" title="Zoom In">
        <i data-lucide="plus" width="20" height="20"></i>
      </button>
      <button class="control-btn" id="btn-zoom-out" title="Zoom Out">
        <i data-lucide="minus" width="20" height="20"></i>
      </button>
    </div>

    <details id="btn-info">
      <summary class="control-btn" title="Attribution Info" aria-label="Attribution Info" style="outline-style: none;">
        <i data-lucide="info" width="20" height="20"></i>
      </summary>
      <span class="attribution-modal">
        Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
      </span>
    </details>
      

  </div>

  <div class="data-error" id="data-error"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="script.js"></script>
</body>
</html>
